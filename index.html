<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta tags -->
  <meta charset="UTF-8">
  <meta name="description"
    content="A sorting visualizer application for demonstrating bubble, selection, and insertion sorting algorithms.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title -->
  <title>Sorting Visualizer</title>

  <!-- Stylesheets -->
  <link href="styles.css" type="text/css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css">

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.8.0/p5.min.js" defer></script>
  <script src="./scripts/sorting/bubble.js" defer></script>
  <script src="./scripts/sorting/insertion.js" defer></script>
  <script src="./scripts/sorting/selection.js" defer></script>
  <script src="./scripts/buttons.js" defer></script>
  <script src="./scripts/helpers.js" defer></script>
  <script src="./scripts/screen.js" defer></script>
  <script src="./scripts/script.js" defer></script>
  <script src="./scripts/stopwatch.js" defer></script>
</head>

<body>
  <header class="navbar">
    <!-- Stopwatch display and reset button on the left, the algorithm selector and run button on the right (stacked on small screens) -->
    <div class="navbar-group">
      <span id="stopwatch" aria-label="Stopwatch">
        00:00:00
      </span>
      <button id="resetButton" onclick="setup()" aria-label="Undo">
        <i class="fa fa-undo"></i>
      </button>
    </div>
    <a class="navbar-brand" href="./" aria-label="Sorting Algorithms Visualizer home">
      Sorting Algorithms Visualizer
    </a>
    <div class="navbar-group">
      <div class="dropdown" id="algorithmDropdown">
        <button id="algorithmButton" onclick="toggleAlgorithmMenu()" aria-label="Sorting algorithm" aria-haspopup="listbox" aria-expanded="false">Bubble</button>
        <ul class="dropdown-menu" id="algorithmMenu" role="listbox" aria-label="Sorting algorithm" hidden>
          <li role="option" tabindex="-1" data-algorithm="bubble" aria-selected="true" onclick="chooseAlgorithm(this)">Bubble</li>
          <li role="option" tabindex="-1" data-algorithm="selection" aria-selected="false" onclick="chooseAlgorithm(this)">Selection</li>
          <li role="option" tabindex="-1" data-algorithm="insertion" aria-selected="false" onclick="chooseAlgorithm(this)">Insertion</li>
        </ul>
      </div>
      <button id="runButton" onclick="runSelectedAlgorithm()" aria-label="Run">
        <i class="fas fa-play"></i> Run
      </button>
    </div>
  </header>
  <footer>
    <a href="mailto:talalzeini@icloud.com">Contact</a>
    <a href="https://talalzeini.com" target="_blank" rel="noopener">Portfolio</a>
    <p id="copyright"></p>
    <script>document.getElementById("copyright").textContent = `© ${new Date().getFullYear()} Talal El Zeini`;</script>
  </footer>
</body>

</html>
